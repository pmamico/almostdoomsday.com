# DigitalOcean App Platform - static site.
# Deploy:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <APP_ID> --spec .do/app.yaml
#
# site/index.html is committed build output, so App Platform needs no build step.
# Regenerate it locally with `node build.mjs` before pushing.
name: almostdoomsday
region: fra

static_sites:
  - name: site
    github:
      repo: pmamico/almostdoomsday.com
      branch: main
      deploy_on_push: true
    source_dir: /
    output_dir: site
    index_document: index.html
    error_document: index.html

domains:
  - domain: almostdoomsday.com
    type: PRIMARY
    zone: almostdoomsday.com
  - domain: www.almostdoomsday.com
    type: ALIAS
    zone: almostdoomsday.com
